<!-- A DECOLAGEM: a tela de carregamento.

     Ela mora aqui, em HTML servido, e nao no bundle de propósito. Uma tela de
     carregamento que so aparece depois que o JavaScript carregou chega tarde
     justamente na conexao em que ela seria util. Assim ela esta pintada no
     primeiro quadro, antes de React, antes de data.js, antes das fontes.

     O DESENHO, na direcao que o Gabriel pediu em 29/08: "todo preto, com um
     unico aviao de origami vermelho sobrevoando a noite; uma noite bem escura
     com estrelas, o aviao no centro, voando contra o vento".

     Entao: a tela inteira e a noite. Tres camadas de estrelas correndo em
     velocidades diferentes fazem a profundidade — as de tras quase paradas, as
     da frente andando. O aviao fica parado no centro, jogando no ar, e quem
     passa por ele e o VENTO: riscos finos vindo de frente e escapando para
     tras. O rastro que cresce atras dele e a barra de progresso, e nao ha
     outra.

     A versao anterior tinha o disco preto no meio de uma tela vermelha, com as
     estrelas DENTRO do disco. O Gabriel: "lembra astronave". Estava certo —
     disco escuro com pontinhos e uma coisa dando volta e um planeta visto de
     uma escotilha. Estrela dentro de circulo e espaco; estrela no ceu inteiro,
     com um aviao de papel voando embaixo dela, e noite. -->
<div id="v2-decolagem" aria-hidden="true" data-fase="voo">

  <!-- A noite. Tres camadas de nevoa, borradas de verdade e correndo em
       velocidades diferentes: a diferenca de velocidade e a profundidade.

       Antes eram estrelas, e o Gabriel cortou duas vezes seguidas — "parece o
       espaco ainda". Ele tem razao e a razao e simples: ponto branco em fundo
       preto e estrela, e estrela e ceu profundo. Nuvem borrada em fundo preto e
       noite com tempo fechado, que e onde um aviao de papel de verdade voa. -->
  <div class="v2-dec-ceu">
    <!-- A lua. Ela e a unica fonte de luz da cena e mora do lado para onde o
         bico do aviao aponta: a coisa esta voando na direcao dela.

         Branco puro no miolo e um halo largo em volta. Sem a lua a noite nao
         tinha de onde vir a luz, e as tres faces do papel estavam iluminadas
         por nada. -->
    <span class="v2-dec-lua"></span>
    <span class="v2-dec-neb is-1"></span>
    <span class="v2-dec-neb is-2"></span>
    <span class="v2-dec-neb is-3"></span>
  </div>

  <!-- o vento, vindo de frente. Nove riscos com duracoes e alturas diferentes:
       iguais, eles bateriam no compasso e o vento viraria metronomo. -->
  <div class="v2-dec-vento">
    <i style="--t:9%;  --d:1.35s; --a:0s;    --w:120px"></i>
    <i style="--t:21%; --d:.92s;  --a:.5s;   --w:74px"></i>
    <i style="--t:33%; --d:1.6s;  --a:.18s;  --w:170px"></i>
    <i style="--t:44%; --d:.78s;  --a:.9s;   --w:58px"></i>
    <i style="--t:55%; --d:1.15s; --a:.35s;  --w:104px"></i>
    <i style="--t:63%; --d:1.48s; --a:1.1s;  --w:146px"></i>
    <i style="--t:74%; --d:.85s;  --a:.62s;  --w:66px"></i>
    <i style="--t:86%; --d:1.28s; --a:.08s;  --w:132px"></i>
    <i style="--t:93%; --d:1.02s; --a:.78s;  --w:88px"></i>
  </div>

  <!-- o aviao e o rastro -->
  <div class="v2-dec-palco">
    <!-- O eixo do voo. Ele guarda a inclinacao (-20 graus, bico para cima e
         para a direita), e por isso o rastro sai da cauda no angulo certo em vez
         de sair na horizontal por baixo do aviao. -->
    <div class="v2-dec-eixo">
      <!-- O rastro cresce para TRAS. `--p` e o progresso, escrito pelo JS. -->
      <span class="v2-dec-rastro"></span>

      <!-- Tres caixas aninhadas e nao uma: cada uma carrega um movimento com o
           seu proprio periodo (3,4s / 2,6s / 0,9s). Somados num transform so,
           eles se repetiriam juntos a cada volta e o voo teria compasso; em
           periodos diferentes o aviao nunca repete o mesmo quadro, que e o que
           faz ar turbulento parecer ar turbulento. -->
      <span class="v2-dec-boia">
        <span class="v2-dec-caimento">
          <span class="v2-dec-tremor">
            <!-- O origami, em perspectiva de tres quartos.

                 A silhueta chapada de antes era o mesmo aviaozinho que cruza a
                 rolagem — certo para 13px dentro de um botao, pobre para 300px
                 no meio da tela. Aqui ele e visto de cima e de tras, como na
                 referencia que o Gabriel mandou: tres faces de papel, cada uma
                 com o seu degrade, mais o vinco central e a borda de fuga.

                 Sao quatro valores do MESMO vermelho, e nao quatro cores: papel
                 dobrado so existe se as faces tiverem luz diferente. -->
            <svg class="v2-dec-aviao" viewBox="0 0 340 220" focusable="false" aria-hidden="true">
              <defs>
                <linearGradient id="v2dfa" x1="1" y1="0" x2="0" y2=".7">
                  <stop offset="0" stop-color="#FF6156"/>
                  <stop offset=".5" stop-color="#EE3A2D"/>
                  <stop offset="1" stop-color="#BC1E14"/>
                </linearGradient>
                <linearGradient id="v2dfb" x1="1" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#D8241A"/>
                  <stop offset=".6" stop-color="#B0170F"/>
                  <stop offset="1" stop-color="#820D07"/>
                </linearGradient>
                <linearGradient id="v2dfc" x1="1" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#7E0C07"/>
                  <stop offset="1" stop-color="#4C0502"/>
                </linearGradient>
              </defs>
              <!-- a face de BAIXO do papel, que a dobra virou para fora -->
              <path d="M322 96 L72 120 L96 206 Z" fill="url(#v2dfc)"/>
              <!-- a asa de perto -->
              <path d="M322 96 L72 120 L44 178 Z" fill="url(#v2dfb)"/>
              <!-- a asa de longe, que e a que pega luz -->
              <path d="M322 96 L18 40 L72 120 Z" fill="url(#v2dfa)"/>
              <!-- o brilho da borda de ataque -->
              <path d="M322 96 L18 40" stroke="#FFA79E" stroke-width="1.4" opacity=".55"
                    fill="none" stroke-linecap="round"/>
              <!-- o vinco central, que e a quilha -->
              <path d="M322 96 L72 120" stroke="#FF9B90" stroke-width="1.8" opacity=".9"
                    fill="none" stroke-linecap="round"/>
              <!-- a borda de fuga, na sombra -->
              <path d="M18 40 L72 120 L44 178" stroke="#6E0A05" stroke-width="1.2"
                    fill="none" opacity=".7"/>
            </svg>
          </span>
        </span>
      </span>
    </div>
  </div>

  <!-- O pe da tela: uma frase e um filete.

       O `( DECOLANDO )` em mono e caixa alta saiu ha duas versoes, por parecer
       legenda de painel de nave. O contador em numero saiu agora, por outro
       motivo: com o rastro do aviao ja dizendo quanto falta, o numero era o
       terceiro indicador da mesma coisa, e numero e a coisa menos quieta que
       existe. Ficaram a frase e o filete.

       A frase e trocavel: ela mora so aqui. -->
  <div class="v2-dec-pe">
    <p class="v2-dec-frase">Todo voo começa com uma dobra.</p>
    <span class="v2-dec-barra"><i></i></span>
  </div>
</div>
