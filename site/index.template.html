<body>
<!-- `data-decolando` trava a rolagem enquanto a tela está no ar, e sai junto
     com ela. Fica escrito aqui, e não pelo script, para valer no primeiro
     quadro: um frame de página rolável atrás do vermelho já denuncia o truque.
     O próprio motor tira o atributo em prefers-reduced-motion. -->
<script>document.documentElement.setAttribute("data-decolando","1")</script>
<!--DECOLAGEM-->
<!-- Sem JavaScript a tela nunca sairia: quem a remove é o motor dela. O site
     inteiro depende de JS para renderizar, então aqui não se perde nada além
     do vermelho. -->
<noscript><style>#v2-decolagem{display:none}</style></noscript>

<div id="v2-root"></div>
